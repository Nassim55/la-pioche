<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Pioche — French Flip Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f3ead8;
    --cream-deep: #e8dcc4;
    --paper: #fbf6ea;
    --ink: #1c1611;
    --ink-soft: #5a4d3f;
    --ink-faded: #8a7a68;
    --terracotta: #a23e2c;
    --olive: #5a6b3a;
    --gold: #b08540;
    --accent: #4b6584;   /* La Pioche's own accent (Il Mazzo's is the gold) */
    --shadow: rgba(28, 22, 17, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    background-image:
      radial-gradient(ellipse 600px 400px at 15% 10%, rgba(75, 101, 132, 0.10), transparent 60%),
      radial-gradient(ellipse 800px 500px at 85% 90%, rgba(162, 62, 44, 0.06), transparent 60%);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 20px 48px;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.11  0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: multiply;
  }

  .container {
    max-width: 660px;
    width: 100%;
    position: relative;
    z-index: 2;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 14px;
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 36px;
    line-height: 0.95;
    margin: 0;
    font-style: italic;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .stats {
    display: flex;
    gap: 28px;
    align-items: flex-end;
  }

  .stat { text-align: right; }

  .stat-label {
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faded);
    margin-bottom: 2px;
  }

  .stat-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 600;
    line-height: 1;
  }

  .stat-value .sub {
    color: var(--ink-faded);
    font-size: 18px;
    font-weight: 400;
  }

  .progress-bar {
    height: 2px;
    background: rgba(28, 22, 17, 0.08);
    margin-bottom: 28px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s ease;
  }

  /* ===== Setup view ===== */
  .setup-intro {
    text-align: center;
    margin-bottom: 28px;
  }

  .setup-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .setup-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 38px;
    margin: 0 0 10px;
    line-height: 1;
  }

  .setup-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 auto;
    max-width: 400px;
    line-height: 1.55;
  }

  /* Heading for the noun grid, which now sits below the Start button */
  .noun-grid-head {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px dashed rgba(28, 22, 17, 0.15);
  }

  .verb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(155px, calc(50% - 4px)), 1fr));
    gap: 8px;
    margin-bottom: 22px;
  }

  /* ===== Theme picker ===== */
  .theme-row {
    margin-bottom: 22px;
    padding: 14px 0 16px;
    border-top: 1px dashed rgba(28, 22, 17, 0.15);
    border-bottom: 1px dashed rgba(28, 22, 17, 0.15);
  }

  .theme-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--ink-faded);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .theme-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .theme-chip {
    background: transparent;
    border: 1px dashed rgba(28, 22, 17, 0.22);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 5px 12px 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    user-select: none;
    -webkit-user-select: none;
    font-weight: 500;
  }

  .theme-chip:hover {
    color: var(--ink);
    border-color: var(--ink-soft);
  }

  .theme-chip.partial {
    border-style: solid;
    border-color: var(--accent);
    color: var(--ink);
    background: rgba(75, 101, 132, 0.08);
  }

  .theme-chip.full {
    border-style: solid;
    border-color: var(--accent);
    background: var(--accent);
    color: var(--cream);
  }

  .theme-chip-count {
    opacity: 0.5;
    margin-left: 5px;
    font-weight: 400;
  }

  .theme-chip.full .theme-chip-count { opacity: 0.7; }
  .theme-chip:focus:not(:focus-visible) { outline: none; }

  .verb-chip {
    background: var(--paper);
    border: 1px solid rgba(28, 22, 17, 0.18);
    border-radius: 3px;
    padding: 13px 14px 12px;
    cursor: pointer;
    transition: border-color 0.15s, opacity 0.15s, background 0.15s;
    text-align: left;
    position: relative;
    font-family: inherit;
    color: inherit;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 2px 6px -3px var(--shadow);
    user-select: none;
    -webkit-user-select: none;
  }

  .verb-chip:focus:not(:focus-visible) { outline: none; }

  .verb-chip:hover { border-color: var(--ink); }

  .verb-chip.unselected {
    background: transparent;
    border-style: dashed;
    border-color: rgba(28, 22, 17, 0.22);
    opacity: 0.5;
    box-shadow: none;
  }

  .verb-chip.unselected:hover { opacity: 0.8; border-color: var(--ink-soft); }

  .verb-chip-italian {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    line-height: 1;
    margin-bottom: 5px;
    padding-right: 14px;
  }

  .verb-chip-english {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faded);
    letter-spacing: 0.04em;
    line-height: 1.2;
  }

  .verb-chip-mark {
    position: absolute;
    top: 11px;
    right: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
    font-size: 13px;
    line-height: 1;
    transition: opacity 0.15s;
  }

  .verb-chip.unselected .verb-chip-mark { opacity: 0; }

  /* Shaded by your record: the colour comes in --shade; a tile left out keeps its shade
     (the dashed border and the fading say it's out) */
  .verb-chip.shaded,
  .verb-chip.unselected.shaded { background: var(--shade); }
  .verb-chip.shaded .verb-chip-english { color: var(--ink-soft); }   /* still readable on the deepest shades */
  .shade-key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em; color: var(--ink-faded); }
  .shade-key-bar { width: 120px; height: 10px; border-radius: 5px; border: 1px solid rgba(28, 22, 17, 0.12); }
  .shade-key-note { flex-basis: 100%; font-size: 10px; }

  .setup-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    font-size: 12px;
    color: var(--ink-faded);
    flex-wrap: wrap;
    gap: 12px;
  }

  .ghost {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-color: rgba(28, 22, 17, 0.25);
    padding: 0;
    transition: color 0.15s;
  }

  .ghost:hover { color: var(--ink); text-decoration-color: var(--ink); }

  .divider {
    color: var(--ink-faded);
    margin: 0 6px;
    user-select: none;
  }

  .deck-readout {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }

  .deck-readout strong {
    color: var(--ink);
    font-weight: 500;
  }

  /* Voice settings, under the progress strip */
  .audio-row {
    margin: -12px 0 22px;
    padding: 9px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    line-height: 1.5;
  }
  .audio-row:empty { display: none; }
  .audio-row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .audio-row input[type="checkbox"] { accent-color: var(--ink); margin: 0; }
  .audio-row select {
    font-family: inherit;
    font-size: 11px;
    color: var(--ink);
    background: var(--cream);
    border: 1px solid rgba(28, 22, 17, 0.18);
    border-radius: 3px;
    padding: 3px 6px;
    max-width: 180px;
  }
  .audio-row .ghost { font-size: 11px; }

  /* 🔊 buttons */
  .speak-btn {
    margin-left: 8px;
    padding: 1px 7px 2px;
    font-size: 14px;
    line-height: 1.3;
    background: transparent;
    border: 1px solid rgba(28, 22, 17, 0.18);
    border-radius: 12px;
    cursor: pointer;
    vertical-align: 2px;
  }
  .speak-btn:hover { background: rgba(28, 22, 17, 0.06); }
  .fb-meaning { margin-left: 10px; font-style: italic; color: var(--ink-soft); }
  .fb-meaning::before { content: '— '; }
  .card-speak {
    position: absolute;
    bottom: 16px;
    right: 20px;
    padding: 4px 10px;
    font-size: 16px;
    background: transparent;
    border: 1px solid rgba(28, 22, 17, 0.15);
    border-radius: 14px;
    cursor: pointer;
  }
  .card-speak:hover { background: rgba(28, 22, 17, 0.05); }
  .listen-btn {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 18px 30px 14px;
    background: transparent;
    border: 1px solid rgba(28, 22, 17, 0.15);
    border-radius: 18px;
    cursor: pointer;
    font: inherit;
  }
  .listen-btn:hover { background: rgba(28, 22, 17, 0.04); }
  .listen-icon { font-size: 54px; line-height: 1; font-style: normal; }
  .listen-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-style: normal;
    color: var(--ink-faded);
  }

  .setup-meta {
    margin-bottom: 22px;
    padding: 11px 16px;
    background: rgba(75, 101, 132, 0.07);
    border-left: 2px solid var(--accent);
    border-radius: 0 3px 3px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .setup-meta.empty { display: none; }

  .setup-meta strong {
    color: var(--ink);
    font-weight: 500;
  }

  .setup-meta .meta-actions {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .setup-meta .meta-sep { color: var(--ink-faded); }

  .setup-meta .ghost {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
  }

  .deck-cap {
    margin-bottom: 14px;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-faded);
  }

  .deck-cap input {
    width: 64px;
    margin: 0 4px;
    padding: 5px 8px;
    border: 1px solid rgba(28, 22, 17, 0.22);
    border-radius: 3px;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    background: var(--paper);
    text-align: center;
    -moz-appearance: textfield;
  }

  .deck-cap input::-webkit-inner-spin-button,
  .deck-cap input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .deck-cap input:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 0 0 2px rgba(28, 22, 17, 0.06);
  }

  .deck-cap input::placeholder {
    color: var(--ink-faded);
    font-style: italic;
  }

  /* ===== Translation direction toggle (game controls) ===== */
  .direction-toggle {
    display: inline-flex;
    border: 1px solid rgba(28, 22, 17, 0.18);
    border-radius: 3px;
    overflow: hidden;
  }

  .direction-toggle button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 4px 9px;
    background: var(--paper);
    color: var(--ink-soft);
    border: none;
    cursor: pointer;
  }

  .direction-toggle button + button {
    border-left: 1px solid rgba(28, 22, 17, 0.18);
  }

  .direction-toggle button.active {
    background: var(--ink);
    color: var(--paper);
    cursor: default;
  }

  .direction-toggle button:not(.active):hover { color: var(--ink); }

  .override-btn {
    display: block;
    margin-top: 10px;
    font-size: 12px;
  }

  /* ===== Hand-pick modal ===== */
  .hand-pick-btn {
    font-style: italic;
  }

  .focus-modal {
    position: fixed;
    inset: 0;
    background: rgba(28, 22, 17, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .focus-modal[hidden] { display: none; }

  .focus-panel {
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(28, 22, 17, 0.35);
    width: 100%;
    max-width: 640px;
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(28, 22, 17, 0.15);
  }

  .focus-header {
    padding: 20px 24px 14px;
    border-bottom: 1px solid rgba(28, 22, 17, 0.08);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .focus-header h3 {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 24px;
    color: var(--ink);
  }

  .focus-close {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: var(--ink-faded);
    padding: 4px 8px;
    line-height: 1;
    font-family: inherit;
  }

  .focus-close:hover { color: var(--ink); }

  .focus-toolbar {
    padding: 14px 24px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid rgba(28, 22, 17, 0.08);
    background: rgba(28, 22, 17, 0.015);
  }

  .focus-toolbar input[type=search] {
    flex: 1;
    min-width: 140px;
    padding: 6px 10px;
    border: 1px solid rgba(28, 22, 17, 0.22);
    border-radius: 3px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
  }

  .focus-toolbar input[type=search]:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 0 0 2px rgba(28, 22, 17, 0.06);
  }

  .focus-toolbar select {
    padding: 6px 24px 6px 10px;
    border: 1px solid rgba(28, 22, 17, 0.22);
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink);
    background-color: var(--paper);
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%235a4d3f'/></svg>");
    background-repeat: no-repeat;
    background-position: right 7px center;
  }

  .focus-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
    min-height: 240px;
  }

  .focus-item {
    display: grid;
    grid-template-columns: auto 1.1fr 1fr auto auto;
    gap: 14px;
    align-items: center;
    padding: 9px 24px;
    cursor: pointer;
    border-bottom: 1px solid rgba(28, 22, 17, 0.04);
  }

  .focus-item:hover { background: rgba(28, 22, 17, 0.035); }

  .focus-item input[type=checkbox] {
    cursor: pointer;
    width: 15px;
    height: 15px;
    accent-color: var(--olive, #5a6a3a);
    margin: 0;
  }

  .focus-en {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .focus-it {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ink);
  }

  .focus-stat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faded);
    text-align: right;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .focus-rank {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faded);
    letter-spacing: 0.02em;
    text-align: right;
    min-width: 34px;
  }

  .focus-top {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }

  .focus-top input {
    width: 56px;
    padding: 4px 6px;
    border: 1px solid rgba(28, 22, 17, 0.22);
    border-radius: 3px;
    font-family: inherit;
    font-size: 12px;
    text-align: center;
    color: var(--ink);
    background: var(--paper);
    -moz-appearance: textfield;
  }

  .focus-top input::-webkit-inner-spin-button,
  .focus-top input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  .focus-top input:focus,
  .deck-cap select:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 0 0 2px rgba(28, 22, 17, 0.06);
  }

  .deck-cap select {
    margin-left: 4px;
    padding: 5px 24px 5px 8px;
    border: 1px solid rgba(28, 22, 17, 0.22);
    border-radius: 3px;
    font-family: inherit;
    font-size: 11px;
    color: var(--ink);
    background-color: var(--paper);
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%235a4d3f'/></svg>");
    background-repeat: no-repeat;
    background-position: right 7px center;
  }

  .focus-empty {
    padding: 60px 24px;
    text-align: center;
    color: var(--ink-faded);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
  }

  .focus-footer {
    padding: 14px 24px;
    border-top: 1px solid rgba(28, 22, 17, 0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: rgba(28, 22, 17, 0.02);
  }

  .focus-count-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .focus-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .focus-apply-btn {
    padding: 8px 18px;
    font-size: 12px;
    letter-spacing: 0.08em;
    width: auto;
  }

  .start-btn {
    width: 100%;
    padding: 18px;
    font-size: 13px;
    letter-spacing: 0.18em;
  }

  /* Long labels (e.g. the disabled hint) wrap on narrow screens instead of
     pushing the page sideways */
  /* Specificity fix (from the verb game): plain .start-btn loses to button.submit,

  /* ===== Card / game ===== */
  .card {
    background: var(--paper);
    border: 1px solid rgba(28, 22, 17, 0.12);

    padding: 60px 40px 52px;

    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .card::after {
    content: '';

    inset: 6px;
    border: 1px solid rgba(28, 22, 17, 0.06);
    border-radius: 2px;
    pointer-events: none;

    top: 18px;

  button.submit {

  button.submit.secondary { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  button.submit.secondary:hover:not(:disabled) { background: rgba(28, 22, 17, 0.07); }

  .trim-slider { display: inline-flex; align-items: center; gap: 8px; }
  .trim-name { white-space: nowrap; }
  .trim-value { min-width: 6ch; color: var(--ink); font-variant-numeric: tabular-nums; }
  .trim-slider input[type="range"] { --fill: 50%; --fill-color: var(--ink); -webkit-appearance: none; appearance: none; width: 120px; height: 20px; margin: 0; background: transparent; cursor: pointer; }
  .trim-slider.is-focus input[type="range"] { --fill-color: var(--terracotta); }
  .trim-slider input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--fill-color) var(--fill), rgba(28, 22, 17, 0.15) var(--fill)); }
  .trim-slider input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5.5px; border-radius: 50%; background: var(--paper); border: 2px solid var(--fill-color); box-shadow: 0 1px 3px rgba(28, 22, 17, 0.25); }
  .trim-slider input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(28, 22, 17, 0.15); }
  .trim-slider input[type="range"]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--fill-color); }
  .trim-slider input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--paper); border: 2px solid var(--fill-color); }
  .trim-slider input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  @media (max-width: 520px) { .trim-slider input[type="range"] { width: 96px; } .trim-name { min-width: 9ch; } }

  kbd {
    font-family: 'JetBrains Mono', monospace;

  .passive-btn:disabled { opacity: 0.4; cursor: default; }

  .passive-btn-sub { font-size: 13px; color: var(--ink-soft); }

  .container[data-view="passive"] { max-width: 720px; }
  .container[data-view="passive"] .stats,
  .container[data-view="passive"] .progress-bar,

                  box-shadow: 0 1px 0 rgba(28, 22, 17, 0.04), 0 18px 40px -24px rgba(28, 22, 17, 0.35); }
  .passive-it { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: clamp(34px, 7vw, 54px); line-height: 1.15; color: var(--ink); transition: color 0.2s; }

  .passive-reps-n { min-width: 22px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: var(--ink); }
  .mode-toggle.passive-speed { margin: 0; }

                      font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink-soft); cursor: pointer; }
  .passive-note { margin: 10px 0 0; font-family: 'DM Sans', sans-serif; font-size: 13px; line-height: 1.5; color: var(--ink-faded); text-align: center; }

  .passive-cover { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px;
                   background: #14100c; color: var(--cream); text-align: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  .passive-cover[hidden] { display: none; }
  .passive-cover-it { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(32px, 8vw, 52px); line-height: 1.15; color: rgba(243, 234, 216, 0.85); }
  .passive-cover-en { font-family: 'DM Sans', sans-serif; font-size: 17px; color: rgba(243, 234, 216, 0.5); }
  .passive-unlock { position: relative; overflow: hidden; margin-top: 40px; padding: 16px 26px; background: transparent; border: 1px solid rgba(243, 234, 216, 0.35); border-radius: 30px;
                    color: rgba(243, 234, 216, 0.75); font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; -webkit-touch-callout: none; }
  .passive-unlock-fill { position: absolute; inset: 0; width: 0; background: rgba(75, 101, 132, 0.35); }
  .passive-unlock.holding .passive-unlock-fill { width: 100%; transition: width 1.2s linear; }
  .passive-unlock-text { position: relative; }

  .verb-chip { -webkit-touch-callout: none; }   /* a long press on a phone opens the forms, not a menu */

  /* On a phone, the ten sections in two columns */
  @media (max-width: 600px) {
    .mode-toggle.subject-toggle { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  }

  /* Below 1100px every section's setup is one 660px column (side panels stack
     underneath), so the section switcher folds into a 3 + 2 grid of equal buttons.
     Kept last so it overrides the wide-screen rules above. */
  @media (max-width: 1100px) {
    .container[data-view="setup"] { max-width: 660px; }
    .mode-toggle.subject-toggle { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: repeat(5, minmax(0, 1fr)); }   /* ten sections: two rows of five */
    .subject-toggle .mode-option { white-space: normal; }
  }
  .gender-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.7em; font-weight: 400; color: var(--ink-faded); letter-spacing: 0.02em; }
  .accent-miss { color: var(--terracotta); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .accent-note { font-size: 0.85rem; color: var(--ink-soft); margin-top: 6px; }
  .alt-spelling { font-weight: 400; color: var(--ink-faded); font-size: 0.9em; }

<body>
  <div class="container" id="container" data-view="setup">
    <div class="setup-top" id="setup-top"></div>
    <header>
      <div>
        <h1 class="title" id="app-title">Noms</h1>
        <div class="subtitle" id="app-subtitle">La Pioche · Article défini</div>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Score</div>
          <div class="stat-value" id="score">0</div>
        </div>

          <div class="stat-label">Card</div>
          <div class="stat-value"><span id="current">1</span><span class="sub">/<span id="total">400</span></span></div>

      </div>
    </header>

    <div class="progress-bar">
      <div class="progress-fill" id="progress" style="width: 0%"></div>
    </div>

    <div id="game-area"></div>

    <div id="controls"></div>
  </div>

<script>
  // La Pioche — French nouns with their definite article. Each entry has the bare noun (the

  // with no everyday plural). Optional: aspH (an aspirated h, which keeps the full article:
  // le héros), alts (other correct spellings: la clef) and a history note.
  // The field holding the French is still called `it`, as in Il Mazzo (see CLAUDE.md).
  // The first deck (Nov 2026): the ~300 most common French nouns, then 100 everyday nouns
  // from Il Mazzo's concrete themes — see the ranking's notes below.
  const NOUN_ITEMS = [
    { en: "the year (in counting)", it: "l'an", noun: "an", g: "m", pl: "ans", note: "<em>L'an</em> counts years: <em>il a trente ans</em>, <em>le Nouvel An</em>. <em>L'année</em> is the year as a stretch of time: <em>toute l'année</em>, <em>l'année dernière</em>. French splits <em>le jour</em> / <em>la journée</em> and <em>le soir</em> / <em>la soirée</em> the same way." },
    { en: "the time (also the weather)", it: "le temps", noun: "temps", g: "m", pl: "temps", note: "Also the weather: <em>quel temps fait-il ?</em> From Latin <em>tempus</em> (tempo, temporary). For the time on the clock French says <em>l'heure</em>: <em>quelle heure est-il ?</em>" },
    { en: "the day", it: "le jour", noun: "jour", g: "m", pl: "jours", note: "From Latin <em>diurnum</em>, 'daily', which also gives <em>journal</em> and <em>journée</em> — and English journey, once a day's travel." },
    { en: "the fact", it: "le fait", noun: "fait", g: "m", pl: "faits", note: "<em>En fait</em>: in fact, actually. From Latin <em>factum</em>, a thing done." },
    { en: "the time (occasion)", it: "la fois", noun: "fois", g: "f", pl: "fois", note: "<em>Une fois, deux fois</em>: once, twice; <em>à la fois</em>: at once, both. From Latin <em>vices</em>, turns, as in vice versa." },
    { en: "the year", it: "l'année", noun: "année", g: "f", pl: "années" },
    { en: "the world", it: "le monde", noun: "monde", g: "m", pl: "mondes", note: "<em>Tout le monde</em> means everyone, not the whole world; <em>il y a du monde</em>: there are a lot of people." },
    { en: "the thing", it: "la chose", noun: "chose", g: "f", pl: "choses", note: "From Latin <em>causa</em> (a cause, a case), which also gave Italian <em>cosa</em>. <em>Quelque chose</em>: something." },
    { en: "the person", it: "la personne", noun: "personne", g: "f", pl: "personnes", note: "Always feminine, even for a man: <em>c'est une personne charmante</em>. With <em>ne</em>, <em>personne</em> means nobody: <em>je ne vois personne</em>." },
    { en: "the man", it: "l'homme", noun: "homme", g: "m", pl: "hommes", note: "The h is mute, so <em>l'homme</em>. From Latin <em>hominem</em>; its nominative, <em>homo</em>, became <em>on</em>, the French 'one'." },
    { en: "the life", it: "la vie", noun: "vie", g: "f", pl: "vies", note: "<em>C'est la vie</em>: that's life. From Latin <em>vita</em>." },
    { en: "the woman (also the wife)", it: "la femme", noun: "femme", g: "f", pl: "femmes", note: "Said 'fam'. <em>Ma femme</em> is also my wife: everyday French has no separate word." },
    { en: "the people (folk)", it: "les gens", noun: "gens", g: "m", pl: "gens", note: "Plural only, and masculine, though an adjective just before it is traditionally feminine: <em>les vieilles gens</em>. From Latin <em>gens</em>, a clan or people." },
    { en: "the country", it: "le pays", noun: "pays", g: "m", pl: "pays", note: "Also a home area: <em>le Pays basque</em>. The s is silent and the word never changes: <em>un pays, des pays</em>." },
    { en: "the work (also the job)", it: "le travail", noun: "travail", g: "m", pl: "travaux", note: "Plural <em>travaux</em>, works — roadworks, building work. Often traced to Late Latin <em>tripalium</em>, an instrument of torture, though that origin is disputed. English travail and travel come from the same French word." },
    { en: "the part (also a game)", it: "la partie", noun: "partie", g: "f", pl: "parties", note: "Not a party: that's <em>la fête</em> (a celebration) or <em>le parti</em> (political). <em>Une partie de cartes</em>: a game of cards; <em>faire partie de</em>: to be part of." },
    { en: "the state (condition)", it: "l'état", noun: "état", g: "m", pl: "états", note: "With a capital, <em>l'État</em> is the State. The é stands for a lost s: Old French <em>estat</em>, as in English estate and state." },
    { en: "the town (city)", it: "la ville", noun: "ville", g: "f", pl: "villes", note: "From Latin <em>villa</em>, a country estate. <em>En ville</em>: in town." },
    { en: "the courtyard (also the court)", it: "la cour", noun: "cour", g: "f", pl: "cours", note: "Three words to keep apart: <em>la cour</em> (courtyard; royal or law court), <em>le cours</em> (lesson, course, flow) and <em>la course</em> (race, errand — <em>faire les courses</em>, to do the shopping)." },
    { en: "the point (dot)", it: "le point", noun: "point", g: "m", pl: "points", note: "<em>Être sur le point de</em>: to be about to." },
    { en: "the child", it: "l'enfant", noun: "enfant", g: "m", pl: "enfants", note: "<em>Un enfant</em> or <em>une enfant</em>: one form for a boy or a girl. From Latin <em>infans</em>, 'not speaking'." },
    { en: "the moment", it: "le moment", noun: "moment", g: "m", pl: "moments", note: "<em>En ce moment</em>: at the moment. Nouns in <em>-ment</em> are masculine." },
    { en: "the case", it: "le cas", noun: "cas", g: "m", pl: "cas", note: "The s is silent and never changes. <em>En tout cas</em>: in any case." },

    { en: "the end", it: "la fin", noun: "fin", g: "f", pl: "fins", note: "<em>Enfin</em>: at last." },
    { en: "the history (also the story)", it: "l'histoire", noun: "histoire", g: "f", pl: "histoires", note: "Also a story — and, in the plural, a fuss: <em>faire des histoires</em>. The h is mute." },
    { en: "the question", it: "la question", noun: "question", g: "f", pl: "questions", note: "Nouns in <em>-tion</em> are feminine." },
    { en: "the game (play)", it: "le jeu", noun: "jeu", g: "m", pl: "jeux", note: "Nouns in <em>-eu</em> take an x in the plural: <em>les jeux</em>. <em>Les Jeux olympiques</em>: the Olympic Games." },
    { en: "the place", it: "le lieu", noun: "lieu", g: "m", pl: "lieux", note: "Plural <em>lieux</em>. <em>Avoir lieu</em>: to take place." },
    { en: "the right (also the law)", it: "le droit", noun: "droit", g: "m", pl: "droits", note: "A right (<em>les droits de l'homme</em>), and law as a subject: <em>faire son droit</em>, to study law. A single law is <em>une loi</em>." },
    { en: "the name (also the noun)", it: "le nom", noun: "nom", g: "m", pl: "noms", note: "In grammar it's also the noun. From Latin <em>nomen</em>." },
    { en: "the month", it: "le mois", noun: "mois", g: "m", pl: "mois", note: "The s is silent and never changes." },
    { en: "the service (also a favour)", it: "le service", noun: "service", g: "m", pl: "services", note: "<em>Rendre service</em>: to do someone a favour." },
    { en: "the group", it: "le groupe", noun: "groupe", g: "m", pl: "groupes" },
    { en: "the blow (knock)", it: "le coup", noun: "coup", g: "m", pl: "coups", note: "Everywhere in French: <em>un coup de fil</em> (a phone call), <em>un coup d'œil</em> (a glance), <em>tout à coup</em> (suddenly). From Greek <em>kolaphos</em>, a punch, through Latin." },
    { en: "the lesson (also the course, flow)", it: "le cours", noun: "cours", g: "m", pl: "cours", note: "The s is always there: <em>un cours, des cours</em>. <em>Au cours de</em>: during. Not to be confused with <em>la cour</em>, the courtyard." },
    { en: "the family", it: "la famille", noun: "famille", g: "f", pl: "familles" },
    { en: "the week", it: "la semaine", noun: "semaine", g: "f", pl: "semaines", note: "From Latin <em>septimana</em>, a set of seven (days)." },
    { en: "the reason", it: "la raison", noun: "raison", g: "f", pl: "raisons", note: "<em>Avoir raison</em>: to be right." },
    { en: "the price (also the prize)", it: "le prix", noun: "prix", g: "m", pl: "prix", note: "The x is silent and never changes. Both senses come from Latin <em>pretium</em>, worth — the source of English price, prize and praise." },
    { en: "the share (portion)", it: "la part", noun: "part", g: "f", pl: "parts", note: "<em>À part</em>: apart from; <em>de la part de</em>: on behalf of." },
    { en: "the problem", it: "le problème", noun: "problème", g: "m", pl: "problèmes", note: "Nouns from Greek in <em>-ème</em> are masculine despite the e: <em>le problème, le système, le thème, le poème</em>." },
    { en: "the house (also the home)", it: "la maison", noun: "maison", g: "f", pl: "maisons", note: "<em>À la maison</em>: at home. From Latin <em>mansio</em>, a stopping place, as in English mansion." },
    { en: "the girl (also the daughter)", it: "la fille", noun: "fille", g: "f", pl: "filles", note: "<em>Ma fille</em>: my daughter; <em>une jeune fille</em>: a girl, a young woman." },
    { en: "the need", it: "le besoin", noun: "besoin", g: "m", pl: "besoins", note: "<em>Avoir besoin de</em>: to need." },
    { en: "the society (also a company)", it: "la société", noun: "société", g: "f", pl: "sociétés", note: "Also a firm. Most nouns in <em>-té</em> are feminine." },
    { en: "the side", it: "le côté", noun: "côté", g: "m", pl: "côtés", note: "An exception: most <em>-té</em> nouns are feminine, but <em>le côté</em> and <em>l'été</em> are masculine. The ô marks a lost s: Old French <em>costé</em>, from Latin <em>costa</em>, a rib — as in English coast." },

    { en: "the site (also the website)", it: "le site", noun: "site", g: "m", pl: "sites" },
    { en: "the article", it: "l'article", noun: "article", g: "m", pl: "articles" },
    { en: "the idea", it: "l'idée", noun: "idée", g: "f", pl: "idées", note: "Feminine, like most nouns in <em>-ée</em> — but <em>le musée</em> and <em>le lycée</em> are masculine." },

    { en: "the account", it: "le compte", noun: "compte", g: "m", pl: "comptes", note: "From <em>compter</em>, to count. <em>Se rendre compte</em>: to realise." },
    { en: "the water", it: "l'eau", noun: "eau", g: "f", pl: "eaux", note: "Latin <em>aqua</em> wore down through Old French <em>ewe</em> and <em>eaue</em> to <em>eau</em>, said simply 'o'." },

    { en: "the law", it: "la loi", noun: "loi", g: "f", pl: "lois" },
    { en: "the line", it: "la ligne", noun: "ligne", g: "f", pl: "lignes" },
    { en: "the evening", it: "le soir", noun: "soir", g: "m", pl: "soirs", note: "<em>Le soir</em> is the evening as a time of day (<em>ce soir</em>, tonight); <em>la soirée</em> is the evening as a stretch of time, or an evening party." },

    { en: "the number (amount)", it: "le nombre", noun: "nombre", g: "m", pl: "nombres", note: "<em>Le nombre</em> is a quantity; <em>le numéro</em> is a number that identifies (phone, house, bus); <em>le chiffre</em> is a figure, a digit." },

    { en: "the company (business)", it: "l'entreprise", noun: "entreprise", g: "f", pl: "entreprises" },
    { en: "the mother", it: "la mère", noun: "mère", g: "f", pl: "mères", note: "Sounds exactly like <em>la mer</em> (the sea) and <em>le maire</em> (the mayor)." },
    { en: "the level", it: "le niveau", noun: "niveau", g: "m", pl: "niveaux" },

    { en: "the advice (also the council)", it: "le conseil", noun: "conseil", g: "m", pl: "conseils", note: "<em>Un conseil</em> is one piece of advice; <em>des conseils</em>, advice." },
    { en: "the father", it: "le père", noun: "père", g: "m", pl: "pères" },
    { en: "the example", it: "l'exemple", noun: "exemple", g: "m", pl: "exemples", note: "<em>Par exemple</em>: for example." },

    return nounData.slice().sort((a, b) => rankOf(a.noun) - rankOf(b.noun));

  function shuffle(arr) {
    const a = [...arr];

  function normalize(s) {

      .replace(/[àáâã]/g, 'a')
      .replace(/[èéêë]/g, 'e')
      .replace(/[ìíîï]/g, 'i')
      .replace(/[òóôõö]/g, 'o')

  // As in Il Mazzo: capitals don't matter, and an apostrophe can be straight, curly or a
  // space (l'eau, l’eau, l eau); the article is required (maison is wrong) and so is the
  // elision (la eau is wrong). Accents (the user's choice, Nov 2026): a missing accent is
  // forgiven (la foret passes for la forêt) but a wrong or extra one is not (la forèt, la
  // fôret); the cedilla and hyphens work the same way (garcon, grand mere and grandmere
  // pass). oe for œ always passes, since most keyboards have no œ. A card's alts are other
  // correct spellings (la clef); the one needing the fewest allowances wins.
  const FOLD = { 'à': 'a', 'â': 'a', 'ä': 'a', 'é': 'e', 'è': 'e', 'ê': 'e', 'ë': 'e', 'î': 'i', 'ï': 'i',

      const ac = a[j], gc = g[i];
      if (gc === ac) { i++; continue; }
      if (ac === 'œ' && g.startsWith('oe', i)) { i += 2; continue; }
      if (ac === 'æ' && g.startsWith('ae', i)) { i += 2; continue; }
      if (ac === '-') { missing.push(j); if (gc === ' ') i++; continue; }   // a space, or nothing
      if (FOLD[ac] && gc === FOLD[ac]) { missing.push(j); i++; continue; }
      return null;

  // Returns { correct, missing?, answer? } or { correct: false, reason } where reason is
  // 'missing-article' or 'wrong-article' (an elision missed or made counts as the latter)
  function checkAnswer(rawGuess, card) {
    const guess = prepFr(rawGuess);
    if (guess === '') return { correct: false };
    const answers = [card.italian, ...(card.alts || [])];
    let best = null;
    for (const a of answers) {
      const missing = frMatch(guess, prepFr(a));
      if (missing && (!best || missing.length < best.missing.length)) best = { correct: true, missing, answer: a };

    const nouns = answers.map(a => splitArticle(prepFr(a))[1]);

    if (!/^(l'|les )/.test(card.italian)) return '';

  function articleRuleHTML(card) {
    const [art, word] = splitArticle(prepFr(card.italian));
    const noun = `<strong>${escapeHTML(card.noun)}</strong>`, full = `<strong>${escapeHTML(card.italian)}</strong>`;
    const gender = card.gender === 'f' ? 'feminine' : 'masculine';

    if (card.aspH) return `the h of ${noun} is aspirated, so there's no elision: ${full}`;

  // Lenient on purpose: "the/a/an" is optional, bracketed qualifiers are ignored,
  // each slash-separated meaning counts ("the rock/cliff" accepts rock or cliff),
  // and punctuation, hyphens and spacing don't matter (band-aid = band aid = bandaid).
  function englishCore(s) {
    return normalize(s)
      .replace(/\([^)]*\)/g, ' ')
      .replace(/[^a-z0-9\/ ]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/^(the|a|an) /, '');
  }

  function compactEnglish(s) {
    return s.replace(/[\s\/]/g, '');
  }

  function checkEnglish(rawGuess, card) {
    const guess = englishCore(rawGuess);
    if (guess === '') return { correct: false };
    const core = englishCore(card.english);
    const alternatives = [core, ...core.split('/').map(p => p.trim().replace(/^(the|a|an) /, ''))];
    const g = compactEnglish(guess);
    return { correct: alternatives.some(a => a && compactEnglish(a) === g) };
  }

    return cards;

  const DIR_LABELS = {

    'it-en': { short: 'FR → EN', long: 'French → English' },
    listen: { short: '🔊 Listening', long: 'Listening' }

  let stats = {};   // loaded for the current subject and direction by applySubject()

  // Keys live in SUBJECTS; progress is { [key]: { seen, wrong } }.
  function statsKey() { return SUBJECTS[subject].statsKeys[direction]; }

  function loadStats() {
    try {
      const raw = localStorage.getItem(statsKey());
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return {};
      return parsed;
    } catch (e) {
      return {};

  function saveStats() {
    try {

  // ===== Spaced repetition: when each item is next due, per section and direction =====
  // One record per item: { b: box 1–7, d: the day it's next due, l: the day it last
  // changed }. Days are whole local days. A correct answer moves an item up a box
  // (at most once a day, so six right conjugations of one verb count once) and sends
  // it out 1, 2, 4, 8, 16, 32 or 64 days; a wrong answer drops it to box 1, due tomorrow.
  const SRS_INTERVALS = [0, 1, 2, 4, 8, 16, 32, 64];
  const SRS_MAX_BOX = 7;
  function today() {
    const now = Date.now();
    return Math.floor((now - new Date(now).getTimezoneOffset() * 60000) / 86400000);
  }
  function srsKey(subj, dir) { return `${SUBJECTS[subj].statsKeys[dir]}:srs`; }
  function loadSrs(subj, dir) {
    try { const o = JSON.parse(localStorage.getItem(srsKey(subj, dir)) || '{}'); return o && typeof o === 'object' ? o : {}; }
    catch (e) { return {}; }
  }
  function saveSrs(subj, dir, srs) {
    try { localStorage.setItem(srsKey(subj, dir), JSON.stringify(srs)); syncTouched(); } catch (e) { /* storage full */ }
  }
  // Any section's progress, in the common { seen, wrong } shape
  function readStats(subj, dir) {
    try {
      return JSON.parse(localStorage.getItem(SUBJECTS[subj].statsKeys[dir]) || '{}') || {};
    } catch (e) { return {}; }
  }
  // History from before the schedule existed: weak items come due now, solid ones are
  // spread over the coming days (spread by name, so it's the same on every load)
  function spreadDays(key, span) {
    let h = 0;
    for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return span > 0 ? h % (span + 1) : 0;
  }
  function seedRecord(key, s, t) {
    const rate = s.wrong / s.seen;
    if (s.wrong > 0 && rate >= 0.25) return { b: 1, d: t, l: null };
    if (s.wrong > 0) return { b: 2, d: t + spreadDays(key, 2), l: null };
    const b = s.seen >= 3 ? 4 : 3;
    return { b, d: t + 1 + spreadDays(key, SRS_INTERVALS[b] - 1), l: null };
  }
  function seedSrs(subj, dir) {
    const srs = loadSrs(subj, dir), t = today();
    let added = false;
    for (const [k, s] of Object.entries(readStats(subj, dir))) {
      if (!srs[k] && s.seen > 0) { srs[k] = seedRecord(k, s, t); added = true; }
    }
    if (added) saveSrs(subj, dir, srs);
    return srs;

  let lastSrsChange = null;   // so "I was right" can undo a demotion
  function srsAnswer(subj, dir, key, correct) {
    const srs = loadSrs(subj, dir), t = today();
    if (!srs[key]) {   // first time on the schedule: start from any earlier history
      const s = readStats(subj, dir)[key];
      if (s && s.seen > 0) srs[key] = seedRecord(key, s, t);
    }
    const prev = srs[key] ? { ...srs[key] } : null;
    const r = srs[key] ? { ...srs[key] } : { b: 0, d: t, l: null };
    if (correct) {
      if (r.l !== t) { r.b = Math.min(r.b + 1, SRS_MAX_BOX); r.d = t + SRS_INTERVALS[r.b]; }
    } else {
      r.b = 1;
      r.d = t + 1;

    r.l = t;

    lastSrsChange = { subj, dir, key, prev };
  }
  function srsUndoLast(subj, dir, key) {
    if (!lastSrsChange || lastSrsChange.subj !== subj || lastSrsChange.dir !== dir || lastSrsChange.key !== key) return false;
    const srs = loadSrs(subj, dir);
    if (lastSrsChange.prev) srs[key] = lastSrsChange.prev; else delete srs[key];
    saveSrs(subj, dir, srs);
    lastSrsChange = null;
    return true;
  }
  // Everything due today (or overdue) in one direction, across all sections,
  // most overdue first, then the shakiest
  function dueList(dir) {
    const t = today(), out = [];
    for (const subj of Object.keys(SUBJECTS)) {
      const srs = seedSrs(subj, dir);
      for (const n of SUBJECTS[subj].items) {
        const r = srs[n.noun];
        if (r && r.d <= t) out.push({ subj, n, r });
      }
    }
    return out.sort((a, b) => (a.r.d - b.r.d) || (a.r.b - b.r.b) || a.n.noun.localeCompare(b.n.noun));
  }
  function dueOnDay(dir, day) {
    let n = 0;
    for (const subj of Object.keys(SUBJECTS)) for (const r of Object.values(seedSrs(subj, dir))) if (r.d === day) n++;
    return n;
  }

  // ===== Start-up checks: warnings in the console (the tests fail on any) =====
  (function validateSubjects() {
    const items = NOUN_ITEMS, keys = items.map(n => n.noun);
    const twice = vals => [...new Set(vals.filter((v, i) => vals.indexOf(v) !== i))];
    const dk = twice(keys), de = twice(items.map(n => n.en.toLowerCase())), df = twice(items.map(n => n.it));
    if (dk.length) console.warn('[nouns] duplicate keys:', dk);
    if (de.length) console.warn('[nouns] English prompts used twice:', de);
    if (df.length) console.warn('[nouns] French forms used twice:', df);
    const themed = new Set(), themeDupes = [];
    for (const th of NOUN_THEMES) {
      const seen = new Set();
      for (const k of th.nouns) { if (seen.has(k)) themeDupes.push(`${th.key}: ${k}`); seen.add(k); themed.add(k); }
    }
    const missing = keys.filter(k => !themed.has(k)), extra = [...themed].filter(k => !keys.includes(k));
    if (missing.length) console.warn('[nouns] uncategorised:', missing);
    if (extra.length) console.warn('[nouns] unknown keys in themes:', extra);
    if (themeDupes.length) console.warn('[nouns] duplicates within a theme:', themeDupes);
    const ranked = new Set(NOUN_FREQUENCY_ORDER);
    const unranked = keys.filter(k => !ranked.has(k)), stray = NOUN_FREQUENCY_ORDER.filter(k => !keys.includes(k));
    if (unranked.length) console.warn('[nouns] without a frequency rank:', unranked);
    if (stray.length) console.warn('[nouns] ranked keys not in the data:', stray);
    // The article fits the gender and the first letter: l' before a vowel or a mute h, the
    // full article before a consonant or an aspirated h (aspH), les for a plural-only noun
    const VOWEL = /^[aàâäeéèêëiîïoôöuùûüœæ]/;
    const badArticle = items.filter(n => {
      const m = n.it.match(/^(le |la |les |l')(.+)$/);
      if (!m || m[2] !== n.noun || !/^[mf]$/.test(n.g) || (n.aspH && !/^h/.test(m[2]))) return true;
      const art = m[1].trim(), word = m[2];
      if (art === 'les') return n.pl !== word;
      const elide = VOWEL.test(word) || (/^h/.test(word) && !n.aspH);
      return elide ? art !== "l'" : art !== (n.g === 'f' ? 'la' : 'le');
    }).map(n => n.it);
    if (badArticle.length) console.warn('[nouns] article, gender or elision wrong:', badArticle);
    const noPlural = items.filter(n => !('pl' in n) || (n.pl !== null && typeof n.pl !== 'string')).map(n => n.it);
    if (noPlural.length) console.warn('[nouns] plural missing (spell it out, or null when there is none):', noPlural);
  })();

  // Returns 'full' | 'partial' | 'empty' for a given theme based on current selection
  function themeState(theme) {
    let selected = 0;
    for (const n of theme.nouns) if (selectedNouns.has(n)) selected++;
    if (selected === 0) return 'empty';
    if (selected === theme.nouns.length) return 'full';
    return 'partial';
  }

  // Return up to `count` noun keys ordered weakest first.
  // Weakness = error rate (with seen-count tie-break). Cards with zero
  // wrong answers don't count as weak; if we don't have enough, we pad
  // with random unseen ones so the button always returns something useful.
  // Shared "weakest first" ordering for the Focus list (takes noun keys).
  // Ranks by error rate (wrong ÷ seen), highest first. Unseen cards count as
  // 100% — nothing learned yet — and land just after cards you've got wrong
  // every single time. Ties: more wrong answers first (stronger evidence), then A–Z.
  function compareWeakness(a, b) {
    const sa = stats[a] || { seen: 0, wrong: 0 };
    const sb = stats[b] || { seen: 0, wrong: 0 };
    const ra = sa.seen > 0 ? sa.wrong / sa.seen : 1;
    const rb = sb.seen > 0 ? sb.wrong / sb.seen : 1;
    if (ra !== rb) return rb - ra;
    if (sa.wrong !== sb.wrong) return sb.wrong - sa.wrong;
    return a.localeCompare(b);
  }

  function weakestNouns(count) {
    const scored = nounData.map(n => {
      const s = stats[n.noun] || { seen: 0, wrong: 0 };
      const rate = s.seen > 0 ? s.wrong / s.seen : 0;
      return { noun: n.noun, rate, wrong: s.wrong, seen: s.seen };
    });
    scored.sort((a, b) => {
      if (b.rate !== a.rate) return b.rate - a.rate;
      return b.wrong - a.wrong;
    });
    const weak = scored.filter(s => s.wrong > 0).slice(0, count);
    if (weak.length < count) {
      const have = new Set(weak.map(w => w.noun));
      const padPool = shuffle(nounData.filter(n => !have.has(n.noun)));
      for (const n of padPool) {
        if (weak.length >= count) break;
        weak.push({ noun: n.noun });
      }
    }
    return weak.map(w => w.noun);
  }

          <span class="divider">·</span>
          <button type="button" class="ghost" id="weakest-10">Weakest 10</button>
          <span class="divider">·</span>
          <button type="button" class="ghost" id="weakest-20">Weakest 20</button>
          <span class="divider">·</span>
          <button type="button" class="ghost" id="clear-all">Clear all</button>
          <span class="divider">·</span>

        </div>

          <strong id="selected-count">${selectedNouns.size}</strong> ${cfg.itemWords} &nbsp;·&nbsp; <strong id="card-count">${selectedNouns.size}</strong> cards<span id="readout-scope"></span>
        </div>

      <div class="setup-meta" id="setup-meta"></div>
      <div class="audio-row" id="audio-row"></div>

      <div class="deck-cap">
        ↳ Or play just <input type="number" id="deck-cap" placeholder="all" min="1" inputmode="numeric" autocomplete="off" /> cards,
        <select id="deck-cap-mode" aria-label="How to choose the subset">
          <option value="random">picked at random</option>
          <option value="frequent">the most common</option>
        </select>

      <button type="button" class="submit start-btn" id="start-btn">▶ Start practising</button>
      <button type="button" class="passive-btn" id="passive-btn"${speechAvailable() ? '' : ' hidden'}><span class="passive-btn-main">🎧 En balade</span><span class="passive-btn-sub">Out and about: hear each card, the French then the English, ${passivePrefs.reps} times over, on a loop — nothing to type</span></button>
      <p class="passive-msg passive-msg-setup" id="passive-msg" aria-live="polite"></p>

      <div class="noun-grid-head">
        <div class="theme-eyebrow">↳ Or pick individual ${cfg.itemWords} — tap, or click and drag${cfg.chipOrder === 'frequency' ? ' · most common first' : ''}</div>
        ${shadeKeyHTML()}
      </div>
      <div class="verb-grid" id="verb-grid">
        ${gridItems().map(n => { const sh = chipShadeAttrs(n.noun); return `
          <button type="button" class="verb-chip${selectedNouns.has(n.noun) ? '' : ' unselected'}${sh.cls}" data-noun="${n.noun}"${sh.attrs}>
            <div class="verb-chip-mark">●</div>
            <div class="verb-chip-italian">${n.display || n.noun}</div>
            <div class="verb-chip-english">${n.en}</div>
          </button>
        `; }).join('')}
      </div>
      </div>
      </div>
    `;

    wireSubjectToggle();

    // ===== Theme picker — clicking a theme fills or clears all its nouns =====
    document.getElementById('theme-chips').addEventListener('click', (e) => {
      const group = e.target.closest('.theme-group-btn');
      if (group) {   // a group heading: all of its themes
        const nouns = THEMES.filter(t => t.group === group.dataset.group).flatMap(t => t.nouns);
        const fill = !nouns.every(n => selectedNouns.has(n));
        for (const n of nouns) { if (fill) selectedNouns.add(n); else selectedNouns.delete(n); }
        gameArea.querySelectorAll('.verb-chip').forEach(c => c.classList.toggle('unselected', !selectedNouns.has(c.dataset.noun)));
        updateReadout();
        return;
      }
      const btn = e.target.closest('.theme-chip');
      if (!btn) return;
      const theme = THEMES.find(t => t.key === btn.dataset.theme);
      if (!theme) return;
      const state = themeState(theme);
      const shouldFill = state !== 'full'; // empty or partial → fill; full → clear
      for (const noun of theme.nouns) {
        if (shouldFill) selectedNouns.add(noun);
        else selectedNouns.delete(noun);
      }
      // Sync noun chip visuals
      gameArea.querySelectorAll('.verb-chip').forEach(c => {
        if (selectedNouns.has(c.dataset.noun)) c.classList.remove('unselected');
        else c.classList.add('unselected');
      });
      updateReadout();
    });

    // ===== Chip selection: click to toggle, click-and-drag to paint =====
    // Strategy: mousedown sets a "paint mode" based on the starting chip's
    // current state (selected → drag deselects, unselected → drag selects),
    // then mouseover on neighbouring chips applies that mode. Single clicks
    // still toggle because mousedown alone is enough to flip the start chip.
    const grid = document.getElementById('verb-grid');

    function setChipState(chipEl, selected) {
      const n = chipEl.dataset.noun;
      if (selected) {
        selectedNouns.add(n);
        chipEl.classList.remove('unselected');
      } else {
        selectedNouns.delete(n);
        chipEl.classList.add('unselected');
      }
    }

    grid.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // ignore right/middle clicks
      const chip = e.target.closest('.verb-chip');
      if (!chip) return;
      e.preventDefault(); // suppress text-selection caret during drag
      const wasSelected = !chip.classList.contains('unselected');
      dragMode = !wasSelected;
      setChipState(chip, dragMode);
      updateReadout();
    });

    grid.addEventListener('mouseover', (e) => {
      if (dragMode === null) return;
      const chip = e.target.closest('.verb-chip');
      if (!chip) return;
      const isSelected = !chip.classList.contains('unselected');
      if (isSelected !== dragMode) {
        setChipState(chip, dragMode);
        updateReadout();
      }
    });

    // Keyboard accessibility: Enter/Space on a focused chip toggles it
    grid.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const chip = e.target.closest('.verb-chip');
      if (!chip) return;
      e.preventDefault();
      const wasSelected = !chip.classList.contains('unselected');
      setChipState(chip, !wasSelected);
      updateReadout();
    });

    document.getElementById('select-all').addEventListener('click', () => {
      nounData.forEach(n => selectedNouns.add(n.noun));
      gameArea.querySelectorAll('.verb-chip').forEach(c => c.classList.remove('unselected'));
      updateReadout();
    });

    document.getElementById('clear-all').addEventListener('click', () => {
      selectedNouns.clear();
      gameArea.querySelectorAll('.verb-chip').forEach(c => c.classList.add('unselected'));
      updateReadout();
    });

    document.getElementById('random-20').addEventListener('click', () => randomPick(20));
    document.getElementById('random-50').addEventListener('click', () => randomPick(50));
    document.getElementById('weakest-10').addEventListener('click', () => weakestPick(10));
    document.getElementById('weakest-20').addEventListener('click', () => weakestPick(20));

    function randomPick(count) {
      const picks = shuffle(nounData).slice(0, Math.min(count, nounData.length)).map(n => n.noun);
      applyPick(picks);
    }

    function weakestPick(count) {
      const picks = weakestNouns(Math.min(count, nounData.length));
      applyPick(picks);
    }

    function applyPick(nounKeys) {
      selectedNouns.clear();
      nounKeys.forEach(k => selectedNouns.add(k));
      gameArea.querySelectorAll('.verb-chip').forEach(c => {
        if (selectedNouns.has(c.dataset.noun)) c.classList.remove('unselected');
        else c.classList.add('unselected');
      });
      updateReadout();
    }

    const capEl = document.getElementById('deck-cap');
    capEl.value = capValue;
    capEl.addEventListener('input', () => { capValue = capEl.value; updateReadout(); });
    const capModeEl = document.getElementById('deck-cap-mode');
    capModeEl.value = capMode;
    capModeEl.addEventListener('change', () => { capMode = capModeEl.value; updateReadout(); });

    // Hand-pick button opens the module-scope focus modal in 'setup' mode
    document.getElementById('hand-pick').addEventListener('click', () => openFocusModal('setup'));

    document.getElementById('start-btn').addEventListener('click', startGame);
    const passiveBtn = document.getElementById('passive-btn');
    if (passiveBtn) passiveBtn.addEventListener('click', startPassive);
    updateReadout();
    renderSetupMeta();
  }

  function updateReadout() {
    const countEl = document.getElementById('selected-count');
    if (!countEl) return; // not in setup view — nothing to update
    const cfg = SUBJECTS[subject];
    countEl.textContent = selectedNouns.size;
    const pool = poolCardCount();
    const effective = effectiveDeckSize();
    document.getElementById('card-count').textContent = effective;
    document.getElementById('readout-scope').textContent =
      usingWholeDeck() ? ` · drawn from all ${nounData.length} ${cfg.itemWords}` : '';
    const start = document.getElementById('start-btn');
    start.disabled = pool === 0;
    const passiveBtn = document.getElementById('passive-btn');
    if (passiveBtn) passiveBtn.disabled = pool === 0;
    start.textContent = pool === 0
      ? `Select some ${cfg.itemWords}, or enter a number above`
      : `▶ Start practising · ${effective}${effective < pool && capMode === 'frequent' ? ' most common' : ''} card${effective === 1 ? '' : 's'}`;
    updateThemeChips();
  }

  // Reads the cap input and returns the effective deck size (min of cap
  // and selection). Empty / invalid / larger-than-selection cap = no cap.
  // The subset box's number, or 0 when it's empty, invalid or not on screen
  function capNumber() {
    const el = document.getElementById('deck-cap');
    const v = el ? parseInt(el.value, 10) : NaN;
    return Number.isFinite(v) && v > 0 ? v : 0;
  }

  // With nothing selected, a number in the subset box draws from the whole deck
  function usingWholeDeck() {
    return selectedNouns.size === 0 && capNumber() > 0;
  }

  // The nouns a fresh game is built from: the selection, or everything
  function playableKeys() {
    return usingWholeDeck() ? new Set(nounData.map(n => n.noun)) : selectedNouns;
  }

  // How many cards a fresh game starts with (the subset number caps the pool)
  // Cards a fresh game would draw from (items × cards per item)
  function poolCardCount() {
    // Items can give different numbers of cards (an adjective has 1, 2 or 4 forms), so count them
    const keys = playableKeys();
    let total = 0;
    for (const n of nounData) if (keys.has(n.noun)) total += cardsForItem(n).length;
    return total;
  }

  function effectiveDeckSize() {
    const n = poolCardCount();
    const cap = capNumber();
    return cap > 0 && cap < n ? cap : n;
  }

  // Sync the visual state of each theme chip (empty / partial / full)
  // No-op if the setup view isn't showing.
  const themeChipHTML = t => `
            <button type="button" class="theme-chip" data-theme="${t.key}">
              ${t.label}<span class="theme-chip-count">${t.nouns.length}</span>
            </button>`;
  function updateThemeChips() {
    const chips = document.getElementById('theme-chips');
    if (!chips) return;
    chips.querySelectorAll('.theme-group-btn').forEach(btn => {
      const nouns = THEMES.filter(t => t.group === btn.dataset.group).flatMap(t => t.nouns);
      const on = nouns.filter(n => selectedNouns.has(n)).length;
      btn.classList.toggle('full', on > 0 && on === nouns.length);
      btn.classList.toggle('partial', on > 0 && on < nouns.length);
    });
    chips.querySelectorAll('.theme-chip').forEach(btn => {
      const theme = THEMES.find(t => t.key === btn.dataset.theme);
      if (!theme) return;
      btn.classList.remove('partial', 'full');
      const state = themeState(theme);
      if (state === 'partial') btn.classList.add('partial');
      else if (state === 'full') btn.classList.add('full');
    });
  }

  function renderSetupMeta() {
    const el = document.getElementById('setup-meta');
    if (!el) return;
    renderWeakPanel();
    renderRipasso();
    renderAudioRow();
    const entries = Object.values(stats);
    const practised = entries.filter(s => s.seen > 0).length;
    const weakCount = entries.filter(s => s.wrong > 0).length;
    // Always shown: back up / restore matter most when a file starts empty
    // (e.g. after renaming it in a browser that keeps each file's storage apart)
    el.classList.remove('empty');
    const dir = direction === 'en-it' ? '' : `${DIR_LABELS[direction].short} · `;
    const summary = practised === 0
      ? `↳ ${dir}No ${SUBJECTS[subject].itemWord} progress logged yet`
      : `↳ ${dir}<strong>${practised}</strong>/${nounData.length} practised &nbsp;·&nbsp; <strong>${weakCount}</strong> with errors logged`;
    el.innerHTML = `
      <span>${summary}</span>
      <span class="meta-actions">
        <button type="button" class="ghost" id="backup-progress" title="Save all progress and associations, for nouns and verbs, to a file">back up</button>
        <span class="meta-sep">·</span>
        <button type="button" class="ghost" id="restore-progress" title="Load progress and associations from a backup file">restore</button>
        ${practised ? '<span class="meta-sep">·</span><button type="button" class="ghost" id="reset-stats">reset progress</button>' : ''}
      </span>
    `;
    document.getElementById('backup-progress').addEventListener('click', backupProgress);
    document.getElementById('restore-progress').addEventListener('click', pickBackupFile);
    if (!practised) return;
    document.getElementById('reset-stats').addEventListener('click', () => {
      const which = DIR_LABELS[direction].long;
      if (confirm(`Reset all ${which} ${SUBJECTS[subject].itemWord} practice history? This cannot be undone.`)) {
        stats = {};
        saveStats();
        try { localStorage.removeItem(srsKey(subject, direction)); } catch (e) { /* ignore */ }
        syncMarkReset([statsKey(), srsKey(subject, direction)]);
        renderSetupMeta();
      }
    });
  }

  // ===== "Da ripassare": the current 10 weakest verbs, under the reference panel =====
  // ===== The grid, shaded by your record (Oct 2026) =====
  // Each tile takes a colour from its error rate in the current direction, continuously:
  // olive (rarely wrong) through gold to terracotta (wrong half the time or more). The
  // colour is faint while a word has had few tries and full from five, so one slip
  // doesn't paint a tile red; untried words stay plain. Hovering gives the numbers.
  const SHADE_STOPS = [[90, 107, 58], [176, 133, 64], [162, 62, 44]];   // --olive, --gold, --terracotta
  const SHADE_PAPER = [251, 246, 234];                                    // --paper
  function shadeColor(t, sure) {
    const [a, b, u] = t < 0.5 ? [SHADE_STOPS[0], SHADE_STOPS[1], t * 2] : [SHADE_STOPS[1], SHADE_STOPS[2], (t - 0.5) * 2];
    const mix = sure * (0.16 + 0.22 * t);   // the colour's share over the paper: the bad end stands out more than the good
    return `rgb(${a.map((x, i) => Math.round(SHADE_PAPER[i] + (x + (b[i] - x) * u - SHADE_PAPER[i]) * mix)).join(', ')})`;
  }
  function errorShade(s) {
    if (!s || !(s.seen > 0)) return null;
    const rate = Math.min(1, Math.max(0, s.wrong / s.seen));
    const t = Math.min(1, rate / 0.5);                          // wrong half the time or more: full terracotta
    const sure = 0.4 + 0.6 * Math.min(1, (s.seen - 1) / 4);    // one try: faint; five or more: full strength
    return { color: shadeColor(t, sure), rate, sure };
  }
  function shadeTitle(s) {
    const dir = DIR_LABELS[direction].long;
    if (!s || !(s.seen > 0)) return `Not practised yet (${dir})`;
    return `Wrong ${s.wrong} of ${s.seen} time${s.seen === 1 ? '' : 's'} — ${Math.round(s.wrong / s.seen * 100)}% (${dir})`;
  }
  function chipShadeAttrs(key) {
    const s = stats[key], sh = errorShade(s);
    return { cls: sh ? ' shaded' : '', attrs: `${sh ? ` style="--shade: ${sh.color}"` : ''} title="${escapeHTML(shadeTitle(s))}"` };
  }
  function shadeKeyHTML() {
    if (!gridItems().some(n => stats[n.noun] && stats[n.noun].seen > 0)) return '';
    return `<div class="shade-key" id="shade-key">
        <span class="shade-key-end">rarely wrong</span>
        <span class="shade-key-bar" style="background: linear-gradient(90deg, ${shadeColor(0, 1)}, ${shadeColor(0.5, 1)}, ${shadeColor(1, 1)})"></span>
        <span class="shade-key-end">often wrong</span>
        <span class="shade-key-note">fainter: only a few tries · plain: not tried yet · ${DIR_LABELS[direction].long}</span>
      </div>`;
  }

  // Same ranking as the verb sections' Weakest 10 button — mistakes ÷ (attempts + 2),
  // so one early slip doesn't outrank a long-running struggle — but only verbs with
  // mistakes, and ties broken A–Z so the list is stable. Follows the current direction.
  function weakestRanked(limit) {
    // Verbs smooth by attempts; nouns and adjectives rank by plain error rate — each
    // matching its section's Weakest 10 button
    const score = s => s.wrong / s.seen;
    return nounData
      .map(n => ({ n, s: stats[n.noun] || { seen: 0, wrong: 0 } }))
      .filter(x => x.s.wrong > 0)
      .sort((a, b) => (score(b.s) - score(a.s)) || (b.s.wrong - a.s.wrong) || a.n.noun.localeCompare(b.n.noun))
      .slice(0, limit);
  }

  function renderWeakPanel() {
    const box = document.getElementById('weak-panel');
    if (!box) return;
    const list = weakestRanked(10);
    const dir = DIR_LABELS[direction].short;
    const count = list.length > 1 ? `${list.length} ` : '';
    box.innerHTML = `
      <h3 class="endings-title">Da ripassare</h3>
      <div class="endings-sub">Your ${count}weakest · ${dir}</div>
      ${list.length ? `
        <ol class="weak-list">
          ${list.map((x, i) => {
            const pct = Math.round(x.s.wrong / x.s.seen * 100);
            return `<li class="weak-row" style="--rate: ${pct}%">
              <span class="weak-rank">${i + 1}</span>
              <span class="weak-verb"><span class="weak-it">${escapeHTML(x.n.it)}</span><span class="weak-en">${escapeHTML(x.n.en)}</span></span>
              <span class="weak-stat">${x.s.wrong}/${x.s.seen} err<span class="weak-pct">${pct}%</span></span>
            </li>`;
          }).join('')}
        </ol>
        <div class="weak-foot"><button type="button" class="ghost" id="weak-select">select these ${list.length}</button></div>
      ` : `<p class="weak-empty">No mistakes logged yet${direction !== 'en-it' ? (direction === 'listen' ? ' in listening' : ' in this direction') : ''}. Your weakest ${SUBJECTS[subject].itemWords} will gather here as you play.</p>`}
    `;
    const btn = document.getElementById('weak-select');
    if (btn) btn.addEventListener('click', () => {
      selectedNouns = new Set(list.map(x => x.n.noun));
      gameArea.querySelectorAll('.verb-chip').forEach(c => c.classList.toggle('unselected', !selectedNouns.has(c.dataset.noun)));
      updateReadout();
    });
    fitSidebar();
  }

  // The side column sticks while you scroll the verb grid. When it's taller than
  // the window, it sticks by its bottom edge instead, so the lower box is never hidden.
  function fitSidebar() {
    const side = document.querySelector('.setup-side');
    if (!side) return;
    side.style.top = `${Math.min(20, window.innerHeight - side.offsetHeight - 20)}px`;
  }
  window.addEventListener('resize', fitSidebar);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSidebar);

  // ===== Audio: French text-to-speech, using the browser's own voices =====
  // Speech must start straight from a click or keypress (Safari and iOS insist),
  // so every speak() call below happens synchronously inside an event handler.
  const AUDIO_KEY = 'pioche-audio-v1';
  const audioPrefs = { auto: true, voiceURI: null, rate: 0.9 };
  try { Object.assign(audioPrefs, JSON.parse(localStorage.getItem(AUDIO_KEY) || '{}')); } catch (e) { /* defaults */ }
  function saveAudioPrefs() {
    try { localStorage.setItem(AUDIO_KEY, JSON.stringify(audioPrefs)); } catch (e) { /* ignore */ }
  }
  function speechAvailable() {
    return typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
  }
  function frenchVoices() {
    if (!speechAvailable()) return [];
    try { return window.speechSynthesis.getVoices().filter(v => /^fr([-_]|$)/i.test(v.lang || '')); } catch (e) { return []; }
  }
  // France's voices first (then other French, then Canada's), and within those the
  // higher-quality voices (macOS Enhanced/Premium, Google's)
  function voiceScore(v) {
    return (/^fr[-_]FR$/i.test(v.lang) ? 8 : /^fr[-_]CA$/i.test(v.lang) ? 0 : 4)
      + (/premium|enhanced|natural|neural/i.test(v.name) ? 4 : 0) + (/google/i.test(v.name) ? 2 : 0) + (v.localService ? 0.5 : 0);
  }
  function chosenVoice() {
    const vs = frenchVoices();
    if (!vs.length) return null;
    return vs.find(v => v.voiceURI === audioPrefs.voiceURI) || vs.slice().sort((a, b) => voiceScore(b) - voiceScore(a))[0];
  }
  function speak(text) {
    const v = chosenVoice();
    if (!v || !text) return false;
    try {
      window.speechSynthesis.cancel();   // never queue up behind an earlier card
      const u = new window.SpeechSynthesisUtterance(text);
      u.voice = v;
      u.lang = v.lang;
      u.rate = audioPrefs.rate;
      window.speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }
  // What a card says aloud: the French answer
  function sayText(card) {
    const base = card.italian;
    return String(base).replace(/…/g, '').trim();
  }
  // ===== En balade: out and about — listen only (Oct 2026) =====
  // Each card is read aloud, the French and then the English, five times over (the
  // number is a setting), then the next card; at the end of the deck it goes round
  // again, reshuffled, for as long as it's left on. Nothing to type or say, and nothing
  // is counted. Phones stop the browser's voice when the screen locks, so this keeps
  // the screen awake, with a pocket lock that ignores taps until you hold to unlock.
  const PASSIVE_KEY = 'pioche-passive-v1';   // { reps, slow } — this device only
  const passivePrefs = { reps: 5, slow: false };
  try { Object.assign(passivePrefs, JSON.parse(localStorage.getItem(PASSIVE_KEY) || '{}')); } catch (e) { /* defaults */ }
  function savePassivePrefs() {
    try { localStorage.setItem(PASSIVE_KEY, JSON.stringify(passivePrefs)); } catch (e) { /* ignore */ }
  }
  // The pauses (ms): French → English, before the next repeat, before the next card;
  // how long a line may take before we stop waiting for it; how long to hold to unlock
  const PASSIVE_GAPS = { itEn: 700, again: 1100, next: 1900, watchdogBase: 3500, watchdogPerChar: 160, unlock: 1200 };
  let passive = null, passiveWakeLock = null;

  // An English voice for the English: British first, then the better-quality voices
  function englishVoice() {
    if (!speechAvailable()) return null;
    let vs = [];
    try { vs = window.speechSynthesis.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang || '')); } catch (e) { /* none */ }
    if (!vs.length) return null;
    const score = v => (/^en[-_]GB$/i.test(v.lang) ? 3 : 0) + (/premium|enhanced|natural|neural/i.test(v.name) ? 4 : 0) + (/google/i.test(v.name) ? 1 : 0) + (v.localService ? 0.5 : 0);
    return vs.slice().sort((a, b) => score(b) - score(a))[0];
  }
  // A card's English, made to be read aloud: no slashes, dots or abbreviations
  // (Brackets aren't read out: "you (pl)" becomes "you all", and any other note in
  // brackets — (facts, how to), (formal), (f.), (of a room) — is left out)
  function spokenEnglish(text) {
    return String(text || '')
      .replace(/\byou \(pl\)/gi, 'you all')
      .replace(/\s*\([^)]*\)/g, '')
      .replace(/\b(he|she)\/(she|he)\b/gi, '$1 or $2')
      .replace(/\s+\/\s+/g, ', or ').replace(/\//g, ' or ')
      .replace(/\s*·\s*/g, ', ').replace(/…/g, '')
      .replace(/\s+([.,!?;:])/g, '$1')
      .replace(/\s{2,}/g, ' ').trim();
  }
  // The same cards a round would deal: the selection, the number, at random or most common first
  function passiveDeck() {
    if (playableKeys().size === 0) return [];
    const pool = buildDeck(), cap = effectiveDeckSize();
    if (capMode === 'frequent' && cap < pool.length) return shuffleDeck(takeCards([...pool].sort((a, b) => compareFrequency(a.noun, b.noun)), cap));
    return takeCards(shuffleDeck(pool), cap);
  }

  async function passiveWake(on) {
    try {
      if (on && !passiveWakeLock && navigator.wakeLock && document.visibilityState === 'visible') {
        const lock = await navigator.wakeLock.request('screen');
        if (!passive) { lock.release(); return; }
        passiveWakeLock = lock;
        if (lock.addEventListener) lock.addEventListener('release', () => { if (passiveWakeLock === lock) passiveWakeLock = null; });
      } else if (!on && passiveWakeLock) {
        const lock = passiveWakeLock;
        passiveWakeLock = null;
        await lock.release();
      }
    } catch (e) { /* not allowed here, or not supported: the screen may sleep */ }
  }

  function startPassive() {
    const msg = document.getElementById('passive-msg');
    if (!chosenVoice()) { if (msg) msg.textContent = 'There’s no French voice on this device yet — see the note on voices below.'; return; }
    const cards = passiveDeck();
    if (!cards.length) return;
    stopListening();
    passive = { cards, index: 0, rep: 0, phase: 'it', playing: true, run: 0, pass: 1, timer: null, watchdog: null, current: null, hidden: false };
    container.dataset.view = 'passive';
    renderPassive();
    passiveWake(true);
    try { window.speechSynthesis.cancel(); } catch (e) { /* no speech */ }

  }
  function passiveStopTimers() {
    if (!passive) return;
    passive.run++;   // anything still on its way from the last line is ignored
    clearTimeout(passive.timer);
    clearTimeout(passive.watchdog);
    try { window.speechSynthesis.cancel(); } catch (e) { /* no speech */ }
  }
  function stopPassive() {
    if (!passive) return;
    passiveStopTimers();
    passive = null;
    passiveWake(false);
    showSetup();
  }

  // One line: the French or the English of the current card, in its own voice
  function passiveStep() {
    if (!passive || !passive.playing) return;
    clearTimeout(passive.timer);
    clearTimeout(passive.watchdog);
    const run = ++passive.run, card = passive.cards[passive.index], it = passive.phase === 'it';
    const text = it ? sayText(card) : spokenEnglish(card.english);
    const voice = it ? chosenVoice() : englishVoice();
    passiveShow();
    if (!voice || !text) { passiveAdvance(run); return; }   // no English voice: the French alone
    let began = false;
    try {
      const u = new window.SpeechSynthesisUtterance(text);
      u.voice = voice;
      u.lang = voice.lang;
      u.rate = it ? (passivePrefs.slow ? 0.7 : audioPrefs.rate) : 0.95;
      u.onstart = () => { began = true; };
      const done = () => { if (passive && run === passive.run) { clearTimeout(passive.watchdog); passiveAdvance(run); } };
      u.onend = done;
      u.onerror = e => { if (!e || (e.error !== 'interrupted' && e.error !== 'canceled')) done(); };
      passive.current = u;   // held on to: some browsers drop the end of an utterance nobody references
      window.speechSynthesis.speak(u);
    } catch (e) { passivePause('The voice didn’t start — tap ▶ to carry on.'); return; }
    // A line that never says it ended: carry on if it was heard, pause if it never began
    passive.watchdog = setTimeout(() => {
      if (!passive || run !== passive.run) return;
      if (began) passiveAdvance(run);
      else passivePause('The voice didn’t start — tap ▶ to carry on.');
    }, PASSIVE_GAPS.watchdogBase + text.length * PASSIVE_GAPS.watchdogPerChar);
  }
  // After a line: the English, the next repeat, or the next card (at the end, round again)
  function passiveAdvance(run) {
    if (!passive || run !== passive.run || !passive.playing) return;
    let gap;
    if (passive.phase === 'it') { passive.phase = 'en'; gap = PASSIVE_GAPS.itEn; }
    else {
      passive.phase = 'it';
      passive.rep += 1;
      if (passive.rep < passivePrefs.reps) gap = PASSIVE_GAPS.again;
      else { passive.rep = 0; passiveMove(1); gap = PASSIVE_GAPS.next; }
    }
    passive.timer = setTimeout(passiveStep, gap);
  }
  function passiveMove(step) {
    let i = passive.index + step;
    if (i >= passive.cards.length) { i = 0; passive.pass += 1; passive.cards = shuffleDeck(passive.cards); }   // round again, in a new order
    else if (i < 0) i = passive.cards.length - 1;
    passive.index = i;
  }
  function passivePause(msg) {
    if (!passive) return;
    passiveStopTimers();
    passive.playing = false;
    passive.phase = 'it';   // carry on from this card's French, at the same repeat
    passiveShow(msg);
  }
  function passiveResume() {
    if (!passive) return;
    passive.playing = true;
    passiveStep();   // from the tap
  }
  function passiveSkip(step) {
    if (!passive) return;
    passiveStopTimers();

    passive.phase = 'it';
    passiveMove(step);

      if (passive.playing) { passiveStopTimers(); passive.phase = 'it'; passive.hidden = true; }
    } else {
      passiveWake(true);
      if (passive.playing && passive.hidden) { passive.hidden = false; passiveStep(); }
    }
  });

  function renderPassive() {
